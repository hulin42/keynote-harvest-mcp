name: MCP Registry

# Publishes server.json to the official MCP Registry using GitHub OIDC.
# Runs after a successful Release and on demand; no-op if the version is listed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-listing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # registry authentication (github-oidc); no secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Registry package version must be live on npm
        run: |
          expected="$(node -p "require('./server.json').packages[0].version")"
          live="$(npm view keynote-harvest-mcp@"$expected" version)"
          [ "$live" = "$expected" ] || { echo "keynote-harvest-mcp@$expected is not on npm" >&2; exit 1; }
      - run: ./mcp-publisher validate
      - name: Skip when this version is already listed
        id: listed
        run: |
          name="$(node -p "encodeURIComponent(require('./server.json').name)")"
          version="$(node -p "require('./server.json').version")"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/$version")"
          case "$code" in
            200) echo "already listed: $version"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "not listed yet: $version"; echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected registry response $code" >&2; exit 1 ;;
          esac
      - if: steps.listed.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc
      - if: steps.listed.outputs.skip == 'false'
        run: ./mcp-publisher publish
