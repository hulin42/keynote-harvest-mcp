name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run test:clean-install
      - run: npm run test:packed-runtime
      - run: npm run test:pdf-runtime
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${expected}" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no token secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Trusted publishing (OIDC) needs npm >= 11.5; Node 22 bundles npm 10.
      # No registry-url / NODE_AUTH_TOKEN here: an .npmrc with an empty token
      # makes npm fail with ENEEDAUTH before it ever tries OIDC.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      # prepack runs the full test suite as the final gate. Auth comes from
      # the npm trusted publisher (hulin42/keynote-harvest-mcp, release.yml)
      # via the job's OIDC token; provenance is attested from the same token.
      - run: npm publish --provenance --access public
